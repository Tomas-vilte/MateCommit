name: Tech Debt / Refactor
description: Propose a refactoring or technical improvement
title: '[REFACTOR] '
labels:
    - refactor
    - tech-debt
body:
    - type: textarea
      id: description
      attributes:
        label: Description
        description: What code needs refactoring?
      validations:
        required: true
    - type: textarea
      id: reason
      attributes:
        label: Reason
        description: Why should we do this? (e.g. readability, maintainability)
